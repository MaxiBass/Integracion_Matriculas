    matricula:
      required: true
      example: 1234BCD
      selector:
        text:
    nueva_matricula:
      example: 1234BCF
      selector:
        text:
    nombre:
      selector:
        text:
    avisar:
      selector:
        boolean:
    abrir:
      selector:
        boolean:
    notas:
      selector:
        text:
          multiline: true
    caduca:
      selector:
        date:

eliminar:
  fields:
    matricula:
      required: true
      example: 1234BCD
      selector:
        text:

ignorar:
  fields:
    matricula:
      required: true
      example: 1234BCD
      selector:
        text:

dejar_de_ignorar:
  fields:
    matricula:
      required: true
      example: 1234BCD
      selector:
        text:

buscar:
  fields:
    matricula:
      required: true
      example: 1234BCD
      selector:
        text:

listar:

importar:
  fields:
    ruta:
      example: /config/packages/videoportero/plates.json
      selector:
        text:
    reemplazar:
      default: false
      selector:
        boolean:

resolver_sugerencia:
  fields:
    id:
      required: true
      example: correccion_1234bcd_1234bcf
      selector:
        text:
    accion:
      required: true
      selector:
        select:
          options:
            - corregir
            - otro_coche
            - eliminar
            - descartar
    matricula:
      selector:
        text:
    nombre:
      selector:
        text:
    avisar:
      selector:
        boolean:
    abrir:
      selector:
        boolean:
    notas:
      selector:
        text:
          multiline: true
    caduca:
      selector:
        date:

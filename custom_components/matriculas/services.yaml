    matricula:
      required: true
      example: 1234BCD
      selector:
        text:
    nombre:
      required: true
      example: Abuelo
      selector:
        text:
    avisar:
      selector:
        boolean:
    abrir:
      selector:
        boolean:
    notas:
      selector:
        text:
          multiline: true
    caduca:
      selector:
        date:

editar:
